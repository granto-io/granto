syntax = "proto3";

package granto.admin.v1;

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/granto-io/granto/core/gen/admin/v1;adminv1";

// OAuth2Service is the Admin API for login/consent handshakes (Hydra-compatible paths).
// Public OAuth2/OIDC endpoints are a separate surface.
service OAuth2Service {
  rpc GetLoginRequest(GetLoginRequestRequest) returns (GetLoginRequestResponse) {
    option (google.api.http) = {
      get: "/admin/oauth2/auth/requests/login"
    };
  }

  rpc AcceptLoginRequest(AcceptLoginRequestRequest) returns (OAuth2RedirectTo) {
    option (google.api.http) = {
      put: "/admin/oauth2/auth/requests/login/accept"
      body: "body"
    };
  }

  rpc RejectLoginRequest(RejectLoginRequestRequest) returns (OAuth2RedirectTo) {
    option (google.api.http) = {
      put: "/admin/oauth2/auth/requests/login/reject"
      body: "body"
    };
  }

  rpc GetConsentRequest(GetConsentRequestRequest) returns (GetConsentRequestResponse) {
    option (google.api.http) = {
      get: "/admin/oauth2/auth/requests/consent"
    };
  }

  rpc AcceptConsentRequest(AcceptConsentRequestRequest) returns (OAuth2RedirectTo) {
    option (google.api.http) = {
      put: "/admin/oauth2/auth/requests/consent/accept"
      body: "body"
    };
  }

  rpc RejectConsentRequest(RejectConsentRequestRequest) returns (OAuth2RedirectTo) {
    option (google.api.http) = {
      put: "/admin/oauth2/auth/requests/consent/reject"
      body: "body"
    };
  }
}

message OAuth2RedirectTo {
  string redirect_to = 1;
}

message OIDCContext {
  repeated string acr_values = 1;
  repeated string ui_locales = 2;
  string display = 3;
  string login_hint = 4;
  google.protobuf.Struct id_token_hint_claims = 5;
}

// ── Login ───────────────────────────────────────────────────────────────────

message GetLoginRequestRequest {
  string login_challenge = 1;
}

message GetLoginRequestResponse {
  string challenge = 1;
  string client_id = 2;
  string request_url = 3;
  string redirect_uri = 4;
  repeated string requested_scope = 5;
  repeated string requested_access_token_audience = 6;
  bool skip = 7;
  string subject = 8;
  string session_id = 9;
  OIDCContext oidc_context = 10;
  // Present for authenticated Get; required on Accept only when admin.accept_strict.
  string accept_token = 11;
}

message AcceptLoginBody {
  string subject = 1;
  bool remember = 2;
  int64 remember_for = 3;
  string acr = 4;
  repeated string amr = 5;
  google.protobuf.Struct context = 6;
  string identity_provider_session_id = 7;
  string accept_token = 8;
}

message AcceptLoginRequestRequest {
  string login_challenge = 1;
  AcceptLoginBody body = 2;
}

message RejectOAuth2Body {
  string error = 1;
  string error_description = 2;
  string error_hint = 3;
  string accept_token = 4;
}

message RejectLoginRequestRequest {
  string login_challenge = 1;
  RejectOAuth2Body body = 2;
}

// ── Consent ─────────────────────────────────────────────────────────────────

message GetConsentRequestRequest {
  string consent_challenge = 1;
}

message GetConsentRequestResponse {
  string challenge = 1;
  string client_id = 2;
  string request_url = 3;
  string redirect_uri = 4;
  repeated string requested_scope = 5;
  repeated string requested_access_token_audience = 6;
  bool skip = 7;
  string subject = 8;
  string session_id = 9;
  string login_challenge = 10;
  string acr = 11;
  repeated string amr = 12;
  google.protobuf.Struct context = 13;
  OIDCContext oidc_context = 14;
  string accept_token = 15;
}

message AcceptConsentRequestSession {
  google.protobuf.Struct access_token = 1;
  google.protobuf.Struct id_token = 2;
}

message AcceptConsentBody {
  repeated string grant_scope = 1;
  repeated string grant_access_token_audience = 2;
  bool remember = 3;
  int64 remember_for = 4;
  AcceptConsentRequestSession session = 5;
  google.protobuf.Struct context = 6;
  string accept_token = 7;
}

message AcceptConsentRequestRequest {
  string consent_challenge = 1;
  AcceptConsentBody body = 2;
}

message RejectConsentRequestRequest {
  string consent_challenge = 1;
  RejectOAuth2Body body = 2;
}
