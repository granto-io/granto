services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: granto
      POSTGRES_USER: granto
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U granto -d granto"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./core:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    ports:
      # Public HTTP (OAuth2 / OIDC / GNAP) — when ListenAndServe is wired.
      - "4444:4444"
      # Admin REST / gRPC — later.
      - "4445:4445"
      - "4446:4446"
    environment:
      POSTGRES_DSN: postgres://granto:secret@postgres:5432/granto?sslmode=disable
      REDIS_ADDR: redis:6379
      PUBLIC_HTTP_ADDR: ":4444"
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  go_mod_cache:
  go_build_cache:
