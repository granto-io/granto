services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: granto
      POSTGRES_USER: granto
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U granto -d granto"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./core:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    ports:
      # Public HTTP (OAuth2 / OIDC / GNAP).
      - "4444:4444"
      # Admin REST (gateway). Admin gRPC defaults to 127.0.0.1:4446 inside the
      # container (not published); gateway dials it locally.
      - "4445:4445"
      # - "4446:4446"  # only if admin_grpc_addr binds 0.0.0.0 / :4446
    environment:
      GRANTO_POSTGRES_DSN: postgres://granto:secret@postgres:5432/granto?sslmode=disable
      GRANTO_REDIS_ADDR: redis:6379
      GRANTO_PUBLIC_ADDR: ":4444"
      GRANTO_LOG_LEVEL: debug
      # Required at startup once config.Load is wired (dev placeholders):
      GRANTO_ISSUER: http://localhost:4444
      GRANTO_MASTER_KEY: "dev-only-master-key-32chars!!"
      GRANTO_ADMIN_TOKEN: change-me
      GRANTO_LOGIN_URL: http://localhost:3000/login
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  go_mod_cache:
  go_build_cache:
