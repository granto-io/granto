services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: granto
      POSTGRES_USER: granto
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U granto -d granto"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./core:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    ports:
      # Public HTTP (OAuth2 / OIDC / GNAP).
      - "4444:4444"
      # Admin REST (gateway). Admin gRPC defaults to 127.0.0.1:4446 inside the
      # container (not published); gateway dials it locally.
      - "4445:4445"
      # - "4446:4446"  # only if admin_grpc_addr binds 0.0.0.0 / :4446
    environment:
      GRANTO_POSTGRES_DSN: postgres://granto:secret@postgres:5432/granto?sslmode=disable
      GRANTO_REDIS_ADDR: redis:6379
      GRANTO_PUBLIC_ADDR: ":4444"
      GRANTO_LOG_LEVEL: debug
      # Required at startup once config.Load is wired (dev placeholders):
      GRANTO_ISSUER: http://localhost:4444
      GRANTO_MASTER_KEY: "dev-only-master-key-32chars!!"
      GRANTO_ADMIN_TOKEN: change-me
      GRANTO_LOGIN_URL: http://localhost:4455/login
      GRANTO_CONSENT_URL: http://localhost:4455/consent
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  identity:
    build:
      context: ./identity
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./identity:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    # No ports published to the host: identity is host-internal (D-048).
    # It binds :4456 inside the container so other compose services (consent)
    # can reach it via the compose-internal network by hostname
    # ("identity:4456"); that network does not leave the host, so this keeps
    # identity's unauthenticated gRPC (VerifyPassword, CreateUser, ...) from
    # being reachable from outside, the same way core's admin gRPC is kept
    # off the host's published ports.
    # ports:
    #   - "4456:4456"  # debugging only; do not leave published
    #   - "4457:4457"  # only if rest_addr binds 0.0.0.0 / :4457
    environment:
      IDENTITY_POSTGRES_DSN: postgres://granto:secret@postgres:5432/granto?sslmode=disable
      IDENTITY_GRPC_ADDR: ":4456"
      IDENTITY_LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy

  consent:
    build:
      context: ./consent
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./consent:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    ports:
      - "4455:4455"
    environment:
      CONSENT_ADDR: ":4455"
      CONSENT_LOG_LEVEL: debug
      CONSENT_CSRF_SECRET: "dev-only-csrf-secret-32chars!!"
      CONSENT_CORE_ADMIN_ADDR: core:4446
      CONSENT_CORE_ADMIN_TOKEN: change-me
      CONSENT_IDENTITY_ADDR: identity:4456
      CONSENT_PLUGINS_ENABLED: email-otp
    depends_on:
      core:
        condition: service_started
      identity:
        condition: service_started

volumes:
  postgres_data:
  go_mod_cache:
  go_build_cache:
